name: CI - SCD_TP_F

on:
  push:
    branches: [ main, master, dev ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del frontend
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias del frontend
        run: npm ci

      - name: Verificar lint
        run: npm run lint

      - name: Verificar build
        run: npm run build

      # Pruebas unitarias y de componentes con dobles (sin backend real) + umbrales de cobertura.
      - name: Ejecutar pruebas con cobertura
        run: npm run test:ci

      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: coverage/

      # Prueba de integración de extremo a extremo contra el backend real (rama dev).
      - name: Checkout del backend de referencia
        uses: actions/checkout@v4
        with:
          repository: Martin12332124/SCD_TP_B
          ref: dev
          path: SCD_TP_B

      - name: Instalar dependencias del backend
        working-directory: SCD_TP_B
        run: npm ci

      - name: Ejecutar prueba de integración con backend real
        run: npm run test:integracion
        env:
          BACKEND_DIRECTORY: SCD_TP_B
